          assert 0.95 <= p95["achieved_detection_probability"] < 0.96
          assert x["adversarial_unknown_design"]["worst_case_detection_probability_lower_bound"] == 0.0
          assert all(x["promotion_gate"].values())
          print({
              "srs_95": p95,
              "adversarial": x["adversarial_unknown_design"],
              "promoted": x["promoted_observation_rule"],
          })
          PY

      - name: Run Game Pass metric-definition drift guard
        run: python scripts/run_e027.py
      - name: Validate E027 metric-definition contract
