      - name: Run human-delivery cost experiment
        run: python scripts/run_e034.py
      - name: Validate E034 human-delivery contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e034/human-delivery-cost-report.json").read_text())
          assert x["experiment"] == "E034"
