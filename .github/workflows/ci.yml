          assert x["hidden_common_mode_model"]["forge_probability"] > 0.01
          assert all(x["promotion_gate"].values())
          print({
              "nominal_probability": x["nominal_model"]["forge_probability"],
              "hidden_probability": x["hidden_common_mode_model"]["forge_probability"],
              "inflation_ratio": x["comparison"]["forge_probability_inflation_ratio"],
              "promoted": x["promoted_dependency_rule"],
          })
          PY

      - name: Run empirical evidence plane
