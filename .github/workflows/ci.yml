          assert x["complexity_selection"]["frontier"]["3"]["worst_max_relative_error"] < 0.10
          assert x["forward_holdout"]["max_relative_error"] < 0.10
          assert all(x["promotion_gate"].values())
          print({
              "minimum_groups": x["complexity_selection"]["minimum_group_count"],
              "partition": x["complexity_selection"]["selected"]["partition"],
              "holdout_max_relative_error": x["forward_holdout"]["max_relative_error"],
              "promoted": x["promoted_regional_rule"],
          })
          PY

      - name: Run sampled-observation assumption audit
        run: python scripts/run_e026.py
      - name: Validate E026 sampling assumption contract
