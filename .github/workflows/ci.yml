name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

      - name: Run exact reference world
        run: python scripts/run_e000.py
      - name: Validate E000 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e000/meta-report.json").read_text())
          assert x["final_winner"]
          assert x["generation_count"] >= 1
          assert all(
              inner["kernel_size"] > 0
              for generation in x["generations"]
              for inner in generation["inner"]
          )
          print({
              "winner": x["final_winner"],
              "generations": x["generation_count"],
              "converged": x["converged"],
          })
          PY

      - name: Run ecological market world
        run: python scripts/run_e010.py
      - name: Validate E010 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e010/report.json").read_text())
          assert x["experiment"] == "E010"
          assert len(x["baseline"]) >= 4
          assert x["inner"]["final"]
          assert x["meta"]["winner"]
          assert all(row["invariant_violations"] == 0 for row in x["baseline"])
          print({
              "inner_final": x["inner"]["final"],
              "meta_winner": x["meta"]["winner"],
              "baseline": {
                  row["mechanism_name"]: round(row["survival_rate"], 3)
                  for row in x["baseline"]
              },
          })
          PY

      - name: Run pressure-knee experiment
        run: python scripts/run_e011.py
      - name: Validate E011 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e011/pressure-report.json").read_text())
          assert x["experiment"] == "E011"
          assert len(x["curves"]) > 0
          assert len(x["knees"]) >= 4
          assert all(abs(row.get("conservation_error", 0.0)) < 1e-6
                     for biopsy in x["biopsies"]
                     for row in biopsy["trace"])
          print({
              "knees": x["knees"],
              "resilience_auc": {
                  k: round(v, 3) for k, v in x["resilience_auc"].items()
              },
              "failure_reasons": {
                  b["mechanism_name"]: b["failure_reasons"]
                  for b in x["biopsies"]
                  if b["failed"]
              },
          })
          PY

      - name: Run evaluator meta-improvement
        run: python scripts/run_e012.py
      - name: Validate E012 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e012/evaluation-design-report.json").read_text())
          assert x["experiment"] == "E012"
          assert x["winner_design"]
          assert x["winner_mechanism"]
          assert len(x["results"]) >= 2
          print({
              "winner_design": x["winner_design"],
              "winner_mechanism": x["winner_mechanism"],
              "design_selection": {
                  row["design_name"]: row["selected_mechanism"]
                  for row in x["results"]
              },
          })
          PY

      - name: Run one-dimensional pressure decomposition
        run: python scripts/run_e013.py
      - name: Validate E013 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e013/pressure-decomposition-report.json").read_text())
          assert x["experiment"] == "E013"
          assert set(x["axes"]) == {
              "subscription_price_multiplier",
              "platform_cost_multiplier",
              "base_churn_rate",
          }
          assert all(len(rows) > 0 for rows in x["axes"].values())
          assert all(
              abs(row.get("conservation_error", 0.0)) < 1e-6
              for biopsy in x["biopsies"]
              for row in biopsy["trace"]
          )
          print({
              "knees": x["knees"],
              "failure_modes": {
                  f"{b['axis']}::{b['mechanism_name']}": b["failure_reasons"]
                  for b in x["biopsies"]
                  if b["failed"]
              },
          })
          PY

      - name: Run pairwise interaction surfaces
        run: python scripts/run_e014.py
      - name: Validate E014 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e014/interaction-surface-report.json").read_text())
          assert x["experiment"] == "E014"
          assert len(x["pairs"]) == 3
          assert len(x["cells"]) > 0
          assert all(
              abs(row.get("conservation_error", 0.0)) < 1e-6
              for biopsy in x["biopsies"]
              for row in biopsy["trace"]
          )
          interaction_cells = sum(
              1 for row in x["cells"] if row["interaction_only"]
          )
          assert interaction_cells > 0
          print({
              "interaction_only_cells": interaction_cells,
              "pairs": x["pairs"],
          })
          PY

      - name: Run adaptive boundary sampling
        run: python scripts/run_e015.py
      - name: Validate E015 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e015/adaptive-boundary-report.json").read_text())
          assert x["experiment"] == "E015"
          assert x["promoted"] is True
          a = x["aggregate"]
          assert a["surface_count"] == 18
          assert a["classification_accuracy"] == 1.0
          assert a["frontier_exact_rate"] == 1.0
          assert a["monotonicity_violation_count"] == 0
          assert a["query_savings_fraction"] >= 0.50
          print({
              "promoted": x["promoted"],
              "aggregate": a,
              "promotion_gate": x["promotion_gate"],
          })
          PY

      - name: Run adaptive guard adversary
        run: python scripts/run_e016.py
      - name: Validate E016 guard contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e016/adaptive-guard-report.json").read_text())
          assert x["experiment"] == "E016"
          assert x["guard_contract_passed"] is True
          assert x["same_generation"]["mode"] == "adaptive"
          assert x["changed_generation"]["mode"] == "exhaustive"
          p = x["adversarial_probe"]
          assert p["monotonicity_violation_count"] > 0
          assert p["naive_classification_accuracy"] < 1.0
          assert x["post_audit_mode"] == "exhaustive"
          assert all(x["promotion_gate"].values())
          print({
              "same_generation": x["same_generation"]["mode"],
              "changed_generation": x["changed_generation"]["mode"],
              "adversarial_accuracy": p["naive_classification_accuracy"],
              "violations": p["monotonicity_violation_count"],
              "post_audit_mode": x["post_audit_mode"],
          })
          PY

      - name: Run certificate lifecycle
        run: python scripts/run_e017.py
      - name: Validate E017 lifecycle contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e017/certificate-lifecycle-report.json").read_text())
          assert x["experiment"] == "E017"
          assert x["lifecycle_contract_passed"] is True
          assert x["stable_summary"]["query_savings_fraction"] >= 0.50
          assert x["failed_audit_decision"]["state"] == "REVOKED"
          assert x["failed_audit_decision"]["required_mode"] == "exhaustive"
          assert x["expiry_decision"]["state"] == "EXPIRED"
          assert x["expiry_decision"]["required_mode"] == "exhaustive"
          assert all(x["promotion_gate"].values())
          print({
              "stable": x["stable_summary"],
              "drift": x["drift_summary"],
              "failed_audit": x["failed_audit_decision"]["state"],
              "expiry": x["expiry_decision"]["state"],
          })
          PY

      - name: Run audit portfolio scheduler
        run: python scripts/run_e018.py
      - name: Validate E018 audit portfolio
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e018/audit-portfolio-report.json").read_text())
          assert x["experiment"] == "E018"
          assert x["promoted_scheduler"] == "bounded-dp"
          a = x["aggregate"]
          assert a["dp_exact_match_rate"] == 1.0
          assert a["dp_work_reduction_fraction"] >= 0.50
          trap = x["greedy_trap"]
          assert trap["oracle"]["total_restoration_value"] == 220
          assert trap["greedy"]["total_restoration_value"] == 160
          assert x["infeasible_mandatory_case"]["dp"]["fail_closed"] is True
          assert all(x["promotion_gate"].values())
          print({
              "aggregate": a,
              "greedy_trap": {
                  "oracle": trap["oracle"]["total_restoration_value"],
                  "greedy": trap["greedy"]["total_restoration_value"],
              },
              "promoted": x["promoted_scheduler"],
          })
          PY

      - name: Run provenance ledger
        run: python scripts/run_e019.py
      - name: Validate E019 provenance contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e019/provenance-ledger-report.json").read_text())
          assert x["experiment"] == "E019"
          assert x["promoted_ledger_contract"] == "sha256-hash-chain-plus-external-checkpoint-v1"
          assert x["reference"]["chain_valid"] is True
          assert x["reference"]["checkpoint_valid"] is True
          assert x["reference"]["replay_state"]["status"] == "ACTIVE"
          attacks = x["attacks"]
          assert attacks["payload_tamper_without_rehash"]["chain_valid"] is False
          assert attacks["delete_event"]["chain_valid"] is False
          assert attacks["reorder_events"]["chain_valid"] is False
          assert attacks["full_rehash_rewrite"]["chain_valid"] is True
          assert attacks["full_rehash_rewrite"]["checkpoint_valid"] is False
          assert attacks["full_rehash_rewrite"]["replay_state"]["status"] == "REVOKED"
          assert all(x["promotion_gate"].values())
          print({
              "ledger": x["promoted_ledger_contract"],
              "reference_state": x["reference"]["replay_state"],
              "rehash_attack": attacks["full_rehash_rewrite"],
          })
          PY

      - name: Run checkpoint rotation
        run: python scripts/run_e020.py
      - name: Validate E020 checkpoint rotation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e020/checkpoint-rotation-report.json").read_text())
          assert x["experiment"] == "E020"
          assert x["promoted_rotation_contract"] == "rotating-checkpoint-chain-with-pinned-anchor-v1"
          assert x["reference"]["rotation_valid"] is True
          assert x["reference"]["pinned_rotation_valid"] is True
          attacks = x["attacks"]
          assert attacks["delete_checkpoint"]["rotation_valid"] is False
          assert attacks["reorder_checkpoints"]["rotation_valid"] is False
          assert attacks["latest_only_forgery"]["latest_only_valid"] is True
          assert attacks["latest_only_forgery"]["pinned_rotation_valid"] is False
          assert attacks["checkpoint_fork"]["detected"] is True
          assert all(x["promotion_gate"].values())
          print({
              "rotation": x["promoted_rotation_contract"],
              "anchored": x["reference"]["anchored_event_count"],
              "tail": x["reference"]["unanchored_tail_events"],
              "attacks": attacks,
          })
          PY

      - name: Run witness quorum experiment
        run: python scripts/run_e021.py
      - name: Validate E021 witness quorum
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e021/witness-quorum-report.json").read_text())
          assert x["experiment"] == "E021"
          assert x["promoted_witness_contract"] == "three-of-five-witness-quorum-with-equivocation-detection-v1"
          assert x["honest_quorum"]["valid"] is True
          assert x["compromise_boundary"]["1"]["valid"] is False
          assert x["compromise_boundary"]["2"]["valid"] is False
          assert x["compromise_boundary"]["3"]["valid"] is True
          strong = x["quorum_geometry"]["three_of_five"]
          weak = x["quorum_geometry"]["two_of_five"]
          assert strong["disjoint_quorum_pairs"] == 0
          assert strong["minimum_intersection"] >= 1
          assert weak["disjoint_quorum_pairs"] > 0
          assert x["split_view"]["view_a"]["valid"] is True
          assert x["split_view"]["view_b"]["valid"] is True
          assert x["split_view"]["equivocation_evidence"]
          assert all(x["promotion_gate"].values())
          print({
              "contract": x["promoted_witness_contract"],
              "strong": strong,
              "weak": weak,
              "compromise": x["compromise_boundary"],
              "equivocation": x["split_view"]["equivocation_evidence"],
          })
          PY

      - name: Run failure-domain diversity experiment
        run: python scripts/run_e022.py
      - name: Validate E022 failure-domain contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e022/failure-domain-report.json").read_text())
          assert x["experiment"] == "E022"
          topologies = x["topologies"]
          assert topologies["concentrated-3-1-1"]["minimum_domains_to_forge"] == 1
          assert topologies["balanced-2-2-1"]["minimum_domains_to_forge"] == 2
          assert topologies["independent-1-1-1-1-1"]["minimum_domains_to_forge"] == 3
          comparison = x["comparison"]
          assert abs(comparison["concentrated_forge_probability"] - 0.10) < 1e-12
          assert abs(comparison["balanced_forge_probability"] - 0.028) < 1e-12
          assert abs(comparison["independent_forge_probability"] - 0.00856) < 1e-12
          assert comparison["independent_forge_reduction_vs_concentrated"] > 0.90
          assert all(x["promotion_gate"].values())
          print({
              "topologies": topologies,
              "comparison": comparison,
              "promoted": x["promoted_failure_domain_rule"],
          })
          PY

      - name: Run hidden common-mode dependency experiment
        run: python scripts/run_e023.py
      - name: Validate E023 hidden common-mode contract
