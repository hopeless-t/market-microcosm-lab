          assert x["growth_authority"]["authorized"] is False
          assert x["growth_authority"]["same_definition"] is False
          assert x["naive_headline_growth"]["authority"] == "illustrative_only"
          assert abs(x["naive_headline_growth"]["naive_growth_fraction"] - 0.36) < 1e-12
          assert all(x["promotion_gate"].values())
