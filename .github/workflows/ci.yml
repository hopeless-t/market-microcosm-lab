name: CI

on:
  push:
  pull_request:

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

      - name: Run exact reference world
        run: python scripts/run_e000.py
      - name: Validate E000 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e000/meta-report.json").read_text())
          assert x["final_winner"]
          assert x["generation_count"] >= 1
          assert all(
              inner["kernel_size"] > 0
              for generation in x["generations"]
              for inner in generation["inner"]
          )
          print({
              "winner": x["final_winner"],
              "generations": x["generation_count"],
              "converged": x["converged"],
          })
          PY

      - name: Run ecological market world
        run: python scripts/run_e010.py
      - name: Validate E010 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e010/report.json").read_text())
          assert x["experiment"] == "E010"
          assert len(x["baseline"]) >= 4
          assert x["inner"]["final"]
          assert x["meta"]["winner"]
          assert all(row["invariant_violations"] == 0 for row in x["baseline"])
          print({
              "inner_final": x["inner"]["final"],
              "meta_winner": x["meta"]["winner"],
              "baseline": {
                  row["mechanism_name"]: round(row["survival_rate"], 3)
                  for row in x["baseline"]
              },
          })
          PY

      - name: Run pressure-knee experiment
        run: python scripts/run_e011.py
      - name: Validate E011 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e011/pressure-report.json").read_text())
          assert x["experiment"] == "E011"
          assert len(x["curves"]) > 0
          assert len(x["knees"]) >= 4
          assert all(abs(row.get("conservation_error", 0.0)) < 1e-6
                     for biopsy in x["biopsies"]
                     for row in biopsy["trace"])
          print({
              "knees": x["knees"],
              "resilience_auc": {
                  k: round(v, 3) for k, v in x["resilience_auc"].items()
              },
              "failure_reasons": {
                  b["mechanism_name"]: b["failure_reasons"]
                  for b in x["biopsies"]
                  if b["failed"]
              },
          })
          PY

      - name: Run evaluator meta-improvement
        run: python scripts/run_e012.py
      - name: Validate E012 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e012/evaluation-design-report.json").read_text())
          assert x["experiment"] == "E012"
          assert x["winner_design"]
          assert x["winner_mechanism"]
          assert len(x["results"]) >= 2
          print({
              "winner_design": x["winner_design"],
              "winner_mechanism": x["winner_mechanism"],
              "design_selection": {
                  row["design_name"]: row["selected_mechanism"]
                  for row in x["results"]
              },
          })
          PY

      - name: Run one-dimensional pressure decomposition
        run: python scripts/run_e013.py
      - name: Validate E013 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e013/pressure-decomposition-report.json").read_text())
          assert x["experiment"] == "E013"
          assert set(x["axes"]) == {
              "subscription_price_multiplier",
              "platform_cost_multiplier",
              "base_churn_rate",
          }
          assert all(len(rows) > 0 for rows in x["axes"].values())
          assert all(
              abs(row.get("conservation_error", 0.0)) < 1e-6
              for biopsy in x["biopsies"]
              for row in biopsy["trace"]
          )
          print({
              "knees": x["knees"],
              "failure_modes": {
                  f"{b['axis']}::{b['mechanism_name']}": b["failure_reasons"]
                  for b in x["biopsies"]
                  if b["failed"]
              },
          })
          PY

      - name: Run pairwise interaction surfaces
        run: python scripts/run_e014.py
      - name: Validate E014 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e014/interaction-surface-report.json").read_text())
          assert x["experiment"] == "E014"
          assert len(x["pairs"]) == 3
          assert len(x["cells"]) > 0
          assert all(
              abs(row.get("conservation_error", 0.0)) < 1e-6
              for biopsy in x["biopsies"]
              for row in biopsy["trace"]
          )
          interaction_cells = sum(
              1 for row in x["cells"] if row["interaction_only"]
          )
          assert interaction_cells > 0
          print({
              "interaction_only_cells": interaction_cells,
              "pairs": x["pairs"],
          })
          PY

      - name: Run adaptive boundary sampling
        run: python scripts/run_e015.py
      - name: Validate E015 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e015/adaptive-boundary-report.json").read_text())
          assert x["experiment"] == "E015"
          assert x["promoted"] is True
          a = x["aggregate"]
          assert a["surface_count"] == 18
          assert a["classification_accuracy"] == 1.0
          assert a["frontier_exact_rate"] == 1.0
          assert a["monotonicity_violation_count"] == 0
          assert a["query_savings_fraction"] >= 0.50
          print({
              "promoted": x["promoted"],
              "aggregate": a,
              "promotion_gate": x["promotion_gate"],
          })
          PY

      - name: Run adaptive guard adversary
        run: python scripts/run_e016.py
      - name: Validate E016 guard contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e016/adaptive-guard-report.json").read_text())
          assert x["experiment"] == "E016"
          assert x["guard_contract_passed"] is True
          assert x["same_generation"]["mode"] == "adaptive"
          assert x["changed_generation"]["mode"] == "exhaustive"
          p = x["adversarial_probe"]
          assert p["monotonicity_violation_count"] > 0
          assert p["naive_classification_accuracy"] < 1.0
          assert x["post_audit_mode"] == "exhaustive"
          assert all(x["promotion_gate"].values())
          print({
              "same_generation": x["same_generation"]["mode"],
              "changed_generation": x["changed_generation"]["mode"],
              "adversarial_accuracy": p["naive_classification_accuracy"],
              "violations": p["monotonicity_violation_count"],
              "post_audit_mode": x["post_audit_mode"],
          })
          PY

      - name: Run certificate lifecycle
        run: python scripts/run_e017.py
      - name: Validate E017 lifecycle contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e017/certificate-lifecycle-report.json").read_text())
          assert x["experiment"] == "E017"
          assert x["lifecycle_contract_passed"] is True
          assert x["stable_summary"]["query_savings_fraction"] >= 0.50
          assert x["failed_audit_decision"]["state"] == "REVOKED"
          assert x["failed_audit_decision"]["required_mode"] == "exhaustive"
          assert x["expiry_decision"]["state"] == "EXPIRED"
          assert x["expiry_decision"]["required_mode"] == "exhaustive"
          assert all(x["promotion_gate"].values())
          print({
              "stable": x["stable_summary"],
              "drift": x["drift_summary"],
              "failed_audit": x["failed_audit_decision"]["state"],
              "expiry": x["expiry_decision"]["state"],
          })
          PY

      - name: Run audit portfolio scheduler
        run: python scripts/run_e018.py
      - name: Validate E018 audit portfolio
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e018/audit-portfolio-report.json").read_text())
          assert x["experiment"] == "E018"
          assert x["promoted_scheduler"] == "bounded-dp"
          a = x["aggregate"]
          assert a["dp_exact_match_rate"] == 1.0
          assert a["dp_work_reduction_fraction"] >= 0.50
          trap = x["greedy_trap"]
          assert trap["oracle"]["total_restoration_value"] == 220
          assert trap["greedy"]["total_restoration_value"] == 160
          assert x["infeasible_mandatory_case"]["dp"]["fail_closed"] is True
          assert all(x["promotion_gate"].values())
          print({
              "aggregate": a,
              "greedy_trap": {
                  "oracle": trap["oracle"]["total_restoration_value"],
                  "greedy": trap["greedy"]["total_restoration_value"],
              },
              "promoted": x["promoted_scheduler"],
          })
          PY

      - name: Verify generated research dashboard
        run: python scripts/render_research_dashboard.py --check

      - name: Publish research dashboard to job summary
        run: cat docs/generated/research-dashboard.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: market-microcosm-reports
          path: |
            artifacts/e000/meta-report.json
            artifacts/e010/report.json
            artifacts/e011/pressure-report.json
            artifacts/e012/evaluation-design-report.json
            artifacts/e013/pressure-decomposition-report.json
            artifacts/e014/interaction-surface-report.json
            artifacts/e015/adaptive-boundary-report.json
            artifacts/e016/adaptive-guard-report.json
            artifacts/e017/certificate-lifecycle-report.json
            artifacts/e018/audit-portfolio-report.json
            docs/generated/e011-pressure.svg
            docs/generated/e012-evaluator.svg
            docs/generated/e013-decomposition.svg
            docs/generated/e014-interactions.svg
            docs/generated/e015-sampling.svg
            docs/generated/e016-guard.svg
            docs/generated/e017-lifecycle.svg
            docs/generated/research-dashboard.md
