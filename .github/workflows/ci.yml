name: CI

on:
  push:
  pull_request:

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

      - name: Run exact reference world
        run: python scripts/run_e000.py
      - name: Validate E000 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e000/meta-report.json").read_text())
          assert x["final_winner"]
          assert x["generation_count"] >= 1
          assert all(
              inner["kernel_size"] > 0
              for generation in x["generations"]
              for inner in generation["inner"]
          )
          print({
              "winner": x["final_winner"],
              "generations": x["generation_count"],
              "converged": x["converged"],
          })
          PY

      - name: Run ecological market world
        run: python scripts/run_e010.py
      - name: Validate E010 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e010/report.json").read_text())
          assert x["experiment"] == "E010"
          assert len(x["baseline"]) >= 4
          assert x["inner"]["final"]
          assert x["meta"]["winner"]
          assert all(row["invariant_violations"] == 0 for row in x["baseline"])
          print({
              "inner_final": x["inner"]["final"],
              "meta_winner": x["meta"]["winner"],
              "baseline": {
                  row["mechanism_name"]: round(row["survival_rate"], 3)
                  for row in x["baseline"]
              },
          })
          PY

      - name: Run pressure-knee experiment
        run: python scripts/run_e011.py
      - name: Validate E011 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e011/pressure-report.json").read_text())
          assert x["experiment"] == "E011"
          assert len(x["curves"]) > 0
          assert len(x["knees"]) >= 4
          assert all(abs(row.get("conservation_error", 0.0)) < 1e-6
                     for biopsy in x["biopsies"]
                     for row in biopsy["trace"])
          print({
              "knees": x["knees"],
              "resilience_auc": {
                  k: round(v, 3) for k, v in x["resilience_auc"].items()
              },
              "failure_reasons": {
                  b["mechanism_name"]: b["failure_reasons"]
                  for b in x["biopsies"]
                  if b["failed"]
              },
          })
          PY

      - name: Run evaluator meta-improvement
        run: python scripts/run_e012.py
      - name: Validate E012 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e012/evaluation-design-report.json").read_text())
          assert x["experiment"] == "E012"
          assert x["winner_design"]
          assert x["winner_mechanism"]
          assert len(x["results"]) >= 2
          print({
              "winner_design": x["winner_design"],
              "winner_mechanism": x["winner_mechanism"],
              "design_selection": {
                  row["design_name"]: row["selected_mechanism"]
                  for row in x["results"]
              },
          })
          PY

      - name: Run one-dimensional pressure decomposition
        run: python scripts/run_e013.py
      - name: Validate E013 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e013/pressure-decomposition-report.json").read_text())
          assert x["experiment"] == "E013"
          assert set(x["axes"]) == {
              "subscription_price_multiplier",
              "platform_cost_multiplier",
              "base_churn_rate",
          }
          assert all(len(rows) > 0 for rows in x["axes"].values())
          assert all(
              abs(row.get("conservation_error", 0.0)) < 1e-6
              for biopsy in x["biopsies"]
              for row in biopsy["trace"]
          )
          print({
              "knees": x["knees"],
              "failure_modes": {
                  f"{b['axis']}::{b['mechanism_name']}": b["failure_reasons"]
                  for b in x["biopsies"]
                  if b["failed"]
              },
          })
          PY

      - name: Run pairwise interaction surfaces
        run: python scripts/run_e014.py
      - name: Validate E014 report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/e014/interaction-surface-report.json").read_text())
          assert x["experiment"] == "E014"
          assert len(x["pairs"]) == 3
          assert len(x["cells"]) > 0
          assert all(
              abs(row.get("conservation_error", 0.0)) < 1e-6
              for biopsy in x["biopsies"]
              for row in biopsy["trace"]
          )
          interaction_cells = sum(
              1 for row in x["cells"] if row["interaction_only"]
          )
          assert interaction_cells > 0
          print({
              "interaction_only_cells": interaction_cells,
              "pairs": x["pairs"],
          })
          PY

      - name: Verify generated research dashboard
        run: python scripts/render_research_dashboard.py --check

      - name: Publish research dashboard to job summary
        run: cat docs/generated/research-dashboard.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: market-microcosm-reports
          path: |
            artifacts/e000/meta-report.json
            artifacts/e010/report.json
            artifacts/e011/pressure-report.json
            artifacts/e012/evaluation-design-report.json
            artifacts/e013/pressure-decomposition-report.json
            artifacts/e014/interaction-surface-report.json
            docs/generated/e011-pressure.svg
            docs/generated/e012-evaluator.svg
            docs/generated/e013-decomposition.svg
            docs/generated/e014-interactions.svg
            docs/generated/research-dashboard.md
