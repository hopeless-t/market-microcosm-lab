<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Market Microcosm Lab</title>
  <desc id="desc">Closed market ecosystem with users, platform, publishers, developers, content, and verified self-improvement loops.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="48%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#063b38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="120" cy="95" r="72" fill="#8b5cf6" opacity=".14"/>
  <circle cx="1270" cy="405" r="120" fill="#22c55e" opacity=".10"/>
  <circle cx="1135" cy="85" r="88" fill="#06b6d4" opacity=".10"/>
  <text x="80" y="105" fill="#f8fafc" font-size="50" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="750">Market Microcosm Lab</text>
  <text x="82" y="150" fill="#b8c4db" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif">Self-improving research for sustainable market ecosystems</text>
  <rect x="80" y="184" width="1238" height="4" rx="2" fill="url(#accent)"/>
  <g transform="translate(80,210)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g fill="#111827" stroke="#3b4a67">
      <rect x="0" y="0" width="220" height="86" rx="17"/>
      <rect x="275" y="0" width="220" height="86" rx="17"/>
      <rect x="550" y="0" width="220" height="86" rx="17"/>
      <rect x="825" y="0" width="220" height="86" rx="17"/>
      <rect x="1100" y="0" width="220" height="86" rx="17"/>
    </g>
    <g fill="#e5edf8" font-size="20">
      <text x="22" y="35">Users</text>
      <text x="297" y="35">Platform</text>
      <text x="572" y="35">Publishers</text>
      <text x="847" y="35">Developers</text>
      <text x="1122" y="35">Content</text>
    </g>
    <g fill="#91a4c0" font-size="14">
      <text x="22" y="63">utility · churn · demand</text>
      <text x="297" y="63">price · reserve · allocation</text>
      <text x="572" y="63">contracts · survival</text>
      <text x="847" y="63">entry · cost · innovation</text>
      <text x="1122" y="63">quality · diversity</text>
    </g>
    <path d="M220 43 H275 M495 43 H550 M770 43 H825 M1045 43 H1100" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M1210 90 C1190 180 240 180 110 94" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  </g>
  <g transform="translate(82,375)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="0" y="0" width="1236" height="82" rx="18" fill="#0f172a" stroke="#31425e"/>
    <text x="28" y="33" fill="#dbeafe" font-size="18">Observe → Challenge → Stress → Verify → Promote / Reject → Repeat</text>
    <text x="28" y="60" fill="#91a4c0" font-size="14">Meta-loop improves the evaluator: curriculum · search budget · horizon · observer</text>
    <rect x="1040" y="20" width="166" height="42" rx="21" fill="#0e2a27" stroke="#22c55e"/>
    <text x="1070" y="47" fill="#86efac" font-size="15" font-weight="700">VERIFIED LOOPS</text>
  </g>
